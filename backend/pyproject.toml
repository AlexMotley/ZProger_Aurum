[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "AlexMotley", email = "piupiubang6@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic==1.19.2",
    "asyncpg==0.31.0",
    "fastapi==0.141.1",
    "httpx==0.28.1",
    "pydantic==2.13.5",
    "pydantic-settings==2.15.0",
    "python-dotenv==1.2.3",
    "sqlalchemy==2.0.52",
    "uvicorn[standard]==0.52.4",
]

[project.scripts]
backend = "app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[dependency-groups]
dev = [
    "numpy>=2.5.3",
    "pandas>=3.0.5",
]
